<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Webest Insurance Corporation – CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#14213d;--mute:#6b7690;--line:#e1e6f0;--navy:#0b2a5b;--gold:#d4a017;--ok:#1b9e5a;--bad:#d64545;--warn:#e08a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--ink:#eaf0ff;--mute:#9aa7c7;--line:#26335a;--navy:#1c3f85}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--ink:#eaf0ff;--mute:#9aa7c7;--line:#26335a;--navy:#1c3f85}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--navy);border-bottom:4px solid var(--gold)}header img{display:block;width:100%;max-width:100%}
header div{color:#fff;text-align:center;font-weight:700;padding:6px;font-size:13px;letter-spacing:.4px}
.wrap{max-width:780px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(11,42,91,.06)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-left:4px solid var(--gold)}
.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--mute)}
h2{font-size:16px;margin:0 0 10px;color:var(--navy)}@media(prefers-color-scheme:dark){h2{color:var(--gold)}}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:64px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.grid .full{grid-column:1/-1}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
button.gold{background:var(--gold);color:#222}button.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
@media(prefers-color-scheme:dark){button.ghost{color:var(--ink)}}
button.sm{padding:6px 10px;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 4px;font-size:13px}.tabs button.on{background:var(--gold);color:#222;border-color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mute);font-size:11px;padding:5px 2px}nav button.on{color:var(--gold)}nav i{display:block;font-size:19px;font-style:normal}
.it{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.it:last-child{border:0}
.it b{display:block}.it small{color:var(--mute)}.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin:2px 4px 0 0}
.Life{color:#b4337a}.Health{color:var(--ok)}.General{color:#2d6cdf}.over{color:var(--bad);font-weight:700}.today{color:var(--warn);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:16px}.ttl{margin:4px 0 12px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:9;max-width:90%}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}.kv span{color:var(--mute)}
.mb{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.mc{background:var(--card);border-radius:14px;padding:18px;max-width:380px;width:100%}.mc p{margin:0 0 14px}
.chk{display:flex;flex-wrap:wrap;gap:6px}.ck{display:flex;align-items:center;gap:6px;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;color:var(--ink)}.ck input{width:auto}
.bar{display:grid;grid-template-columns:92px 1fr 48px;gap:8px;align-items:center;font-size:12px;margin:5px 0}.bar div{background:var(--bg);border-radius:99px;height:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:99px}.bar b{text-align:right}
.donut{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}.donut div{width:66px;height:66px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:18px}
h3{font-size:13px;margin:14px 0 4px;color:var(--mute)}
</style></head><body>
